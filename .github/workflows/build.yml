name: Build Bot X
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name settings.gradle | head -n 1)")
          echo "Projekt w: $DIR"
          cd "$DIR"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: botx-mod
          path: "**/build/libs/*.jar"
